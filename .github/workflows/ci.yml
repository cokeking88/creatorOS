name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      - run: npm run gate
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
